<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>値入率計算</title>
  <meta name="theme-color" content="#1f5f95">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <a class="back-link" href="../../index.html">← ツール一覧へ戻る</a>
      <h1>値入率計算</h1>
      <p class="subtitle">「仕入値.値入率」をテンキーで入力し、販売価格を計算します。</p>
    </header>

    <section class="result-panel" id="resultPanel" data-state="incomplete" aria-live="polite">
      <p class="result-label">販売価格</p>
      <p class="result-value"><span id="resultAmount">―</span><span class="result-unit">円</span></p>
      <p class="input-summary" id="inputSummary">仕入値と値入率を入力してください</p>
      <p class="result-detail" id="resultDetail">例：500.3 → 仕入500円・値入率30%</p>
    </section>

    <section class="input-panel" aria-labelledby="inputLabel">
      <div class="input-heading">
        <label id="inputLabel" for="compositeInput">入力</label>
        <span>x ÷ (1 − y)</span>
      </div>
      <input id="compositeInput" type="text" value="" placeholder="500.3" readonly aria-describedby="inputHelp">
      <p class="input-help" id="inputHelp">小数点より前が仕入値、後が値入率です。計算結果は1円単位で切り上げます。</p>
    </section>

    <section class="keypad" id="keypad" aria-label="数値入力テンキー">
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button class="utility-key" type="button" data-key="backspace" aria-label="1文字消す">⌫</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button class="utility-key" type="button" data-key="clear" aria-label="すべて消す">C</button>
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="." aria-label="小数点">.</button>
      <button class="zero-key" type="button" data-key="0">0</button>
      <button class="double-zero-key" type="button" data-key="00">00</button>
    </section>
  </main>
  <script src="js/calc.js"></script>
  <script src="js/app.js" defer></script>
  <script src="../../shared/js/pwa-client.js" defer></script>
</body>
</html>
