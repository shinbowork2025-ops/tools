<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1f5f95">
  <title>要望・不具合を送る | 業務補助ツール</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#f3f5f7;--surface:#fff;--text:#17202a;--muted:#5f6b76;--line:#d8e0e7;--accent:#1f5f95;--danger:#a43a32}
    *{box-sizing:border-box}html{font-family:"UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text)}body{margin:0}main{width:min(100% - 24px,720px);margin:0 auto;padding:18px 0 calc(40px + env(safe-area-inset-bottom))}
    .back-link{display:inline-flex;align-items:center;min-height:44px;margin-bottom:10px;color:var(--accent);font-weight:700;text-decoration:none}.hero{margin-bottom:18px}.eyebrow{margin:0 0 5px;color:var(--accent);font-size:.8rem;font-weight:700}.hero h1{margin:0;font-size:clamp(1.55rem,6vw,2.2rem)}.hero p{margin:9px 0 0;color:var(--muted);line-height:1.65}
    .panel{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 2px 8px rgba(23,32,42,.05)}label{display:block;margin-bottom:8px;font-weight:700}.required{color:var(--danger);font-size:.78rem}textarea{width:100%;min-height:220px;padding:14px;border:1px solid #aebbc6;border-radius:11px;background:#fff;color:var(--text);font:inherit;font-size:1rem;line-height:1.6;resize:vertical}textarea:focus,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid rgba(31,95,149,.25);outline-offset:2px;border-color:var(--accent)}.counter{margin:6px 0 18px;text-align:right;color:var(--muted);font-size:.75rem}
    details{margin:0 0 18px;border:1px solid var(--line);border-radius:11px;background:#fafbfd}summary{min-height:46px;padding:12px 14px;color:var(--accent);font-size:.82rem;font-weight:700;cursor:pointer}.environment{margin:0;padding:0 14px 14px;list-style:none;color:var(--muted);font-size:.75rem;line-height:1.75}.environment li{overflow-wrap:anywhere}.help{margin:0 0 18px;color:var(--muted);font-size:.76rem;line-height:1.6}
    .submit-button{width:100%;min-height:52px;padding:12px 16px;border:1px solid var(--accent);border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}.submit-button:disabled{cursor:default;opacity:.6}.status{min-height:1.5em;margin:12px 0 0;color:var(--danger);font-size:.82rem;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../">← ツール一覧へ戻る</a>
    <header class="hero">
      <p class="eyebrow">改善受付</p>
      <h1>要望・不具合を送る</h1>
      <p>内容を入力すると、環境情報を添えたGoogleフォームを開きます。フォーム上で内容を確認して送信してください。</p>
    </header>

    <form class="panel" id="feedbackForm">
      <label for="message">要望・不具合の内容 <span class="required">必須</span></label>
      <textarea id="message" maxlength="2000" required autocomplete="off" placeholder="どの画面で、何をしたときに、どうなったかを書いてください。改善の要望だけでも送れます。"></textarea>
      <p class="counter"><span id="messageCount">0</span> / 2000文字</p>

      <details>
        <summary>Googleフォームへ添付する情報を見る</summary>
        <ul class="environment" id="environmentList"></ul>
      </details>
      <p class="help">ツール名、バージョン、OS、ブラウザ、画面サイズ、起動方法、送信日時を自動で入力します。位置情報、社員番号、検索履歴は取得しません。</p>

      <button class="submit-button" id="submitButton" type="submit">Googleフォームで確認する</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (() => {
      'use strict';

      const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSc1rPBvHfXz-b0NiNUxNQBxZrIRpMYhWEuiWEL_nW9D5M6qOQ/viewform';
      const MESSAGE_ENTRY = 'entry.668672964';
      const ENVIRONMENT_ENTRY = 'entry.1335742535';
      const form = document.getElementById('feedbackForm');
      const message = document.getElementById('message');
      const count = document.getElementById('messageCount');
      const submitButton = document.getElementById('submitButton');
      const status = document.getElementById('status');
      let environmentText = '';

      function detectOs() {
        const ua = navigator.userAgent;
        if (/Android/i.test(ua)) return 'Android';
        if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS / iPadOS';
        if (/Windows/i.test(ua)) return 'Windows';
        if (/Macintosh|Mac OS X/i.test(ua)) return 'macOS';
        if (/Linux/i.test(ua)) return 'Linux';
        return '不明';
      }

      function detectBrowser() {
        const ua = navigator.userAgent;
        if (/Edg\//.test(ua)) return 'Microsoft Edge';
        if (/Firefox\//.test(ua)) return 'Firefox';
        if (/CriOS\//.test(ua)) return 'Chrome (iOS)';
        if (/Chrome\//.test(ua)) return 'Google Chrome';
        if (/Safari\//.test(ua)) return 'Safari';
        return '不明';
      }

      async function getVersion() {
        try {
          const response = await fetch('../version.json', { cache: 'no-store' });
          if (!response.ok) throw new Error();
          return (await response.json()).version || '不明';
        } catch {
          return '不明';
        }
      }

      async function refreshEnvironment() {
        const version = await getVersion();
        const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        const values = {
          'ツール名': '業務補助ツール 要望受付',
          'バージョン': version,
          'OS': detectOs(),
          'ブラウザ': detectBrowser(),
          '画面サイズ': `${screen.width} × ${screen.height}`,
          '表示領域': `${window.innerWidth} × ${window.innerHeight}`,
          '起動方法': standalone ? 'PWA' : 'ブラウザ',
          '通信状態': navigator.onLine ? 'オンライン' : 'オフライン',
          '作成日時': new Date().toLocaleString('ja-JP')
        };
        environmentText = Object.entries(values).map(([key, value]) => `${key}: ${value}`).join('\n');
        document.getElementById('environmentList').innerHTML = Object.entries(values)
          .map(([key, value]) => `<li><strong>${key}:</strong> ${value}</li>`)
          .join('');
      }

      message.addEventListener('input', () => {
        count.textContent = String(message.value.length);
        status.textContent = '';
      });
      window.addEventListener('resize', refreshEnvironment);
      window.addEventListener('online', refreshEnvironment);
      window.addEventListener('offline', refreshEnvironment);

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        if (!navigator.onLine) {
          status.textContent = '現在オフラインです。通信できる場所で再度お試しください。';
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Googleフォームを開いています…';
        await refreshEnvironment();

        const url = new URL(FORM_URL);
        url.searchParams.set('usp', 'pp_url');
        url.searchParams.set(MESSAGE_ENTRY, message.value.trim());
        url.searchParams.set(ENVIRONMENT_ENTRY, environmentText);
        window.location.assign(url.toString());
      });

      refreshEnvironment();
    })();
  </script>
  <script src="../shared/js/pwa-client.js" defer></script>
</body>
</html>
